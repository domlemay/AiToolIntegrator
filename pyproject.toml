[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitoolintegrator"
version = "0.1.0"
description = "The universal AI tools package manager — discover, install, and orchestrate AI open-source tools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dominic Lemay", email = "domlemay@gmail.com" }]
requires-python = ">=3.11"
keywords = ["ai", "tools", "cli", "package-manager", "orchestrator", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
]

[project.scripts]
aitool = "aitoolintegrator.cli.main:app"

[project.urls]
Homepage = "https://github.com/domlemay/AiToolIntegrator"
Repository = "https://github.com/domlemay/AiToolIntegrator"
Issues = "https://github.com/domlemay/AiToolIntegrator/issues"

# ── Hatch build ───────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["aitoolintegrator"]

[tool.hatch.build.targets.wheel.force-include]
# Ensure registry data files are always bundled in the wheel
"aitoolintegrator/registry/tools.json" = "aitoolintegrator/registry/tools.json"
"aitoolintegrator/registry/schema.json" = "aitoolintegrator/registry/schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "aitoolintegrator/",
    "tests/",
    "docs/",
    "README.md",
    "README.fr.md",
    "LICENSE",
    "pyproject.toml",
    "MANIFEST.in",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aitoolintegrator", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "RUF", # ruff-specific
]
ignore = [
    "ANN204",  # missing return type for __init__
]

[tool.ruff.lint.isort]
known-first-party = ["aitoolintegrator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --cov=aitoolintegrator --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["aitoolintegrator"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
